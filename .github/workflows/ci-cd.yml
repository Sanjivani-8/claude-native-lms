name: LMS CI/CD (Build, Test, DevSecOps Scan, Deploy)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: sanjivani-8/lms

permissions:
  contents: read
  security-events: write
  actions: read
  packages: write

jobs:
  # ---------------------------------------------------------------------------
  # 1. Build + unit test every module, in parallel, with a shared Maven cache.
  # ---------------------------------------------------------------------------
  build-and-test:
    name: Build & Test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - student-service
          - course-service
          - assignment-service
          - notification-service
          - api-gateway
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: maven

      - name: Build & unit test
        run: mvn -B -pl ${{ matrix.service }} -am verify

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.service }}
          path: ${{ matrix.service }}/target/site/jacoco/**
          if-no-files-found: ignore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-${{ matrix.service }}
          path: ${{ matrix.service }}/target/surefire-reports/**
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # 2. Static analysis (SAST) with SonarQube/SonarCloud — code smells, bugs,
  #    security hotspots. Requires SONAR_TOKEN + SONAR_HOST_URL repo secrets.
  # ---------------------------------------------------------------------------
  sast-sonarqube:
    name: SAST - SonarQube
    runs-on: ubuntu-latest
    needs: build-and-test
    if: ${{ vars.SONAR_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: maven
      - name: Sonar scan (whole reactor)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=Sanjivani-8_claude-native-lms \
            -Dsonar.organization=sanjivani-8 \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.token="$SONAR_TOKEN"

  # ---------------------------------------------------------------------------
  # 3. Software Composition Analysis (SCA) — scan dependencies (pom.xml trees)
  #    for known CVEs with Trivy's filesystem scanner. Fails the build on
  #    HIGH/CRITICAL findings.
  # ---------------------------------------------------------------------------
  sca-dependency-scan:
    name: SCA - Trivy Filesystem Scan
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Trivy fs scan (dependencies + IaC)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-fs-results.sarif
      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs-results.sarif

  # ---------------------------------------------------------------------------
  # 4. Build & push a container image per service (main branch only), then
  #    scan the built IMAGE (not just source) for OS + library CVEs before
  #    it's allowed to be used for deployment.
  # ---------------------------------------------------------------------------
  build-scan-push:
    name: Build, Scan & Push (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [build-and-test, sca-dependency-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        service:
          - auth-service
          - student-service
          - course-service
          - assignment-service
          - notification-service
          - api-gateway
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          docker build -f ${{ matrix.service }}/Dockerfile \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.service }}:${{ github.sha }} \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.service }}:latest \
            .

      - name: Trivy image scan (report HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.service }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
          trivyignores: .trivyignore

      - name: Push image
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.service }}:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.service }}:latest

  # ---------------------------------------------------------------------------
  # 5. Deploy to Kubernetes via kustomize (main branch only). Requires a
  #    KUBE_CONFIG repo secret (base64-encoded kubeconfig for the target cluster).
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build-scan-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Set up kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Configure kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > "$HOME/.kube/config"

      - name: Set image tags & apply manifests
        working-directory: k8s
        run: |
          for svc in auth-service student-service course-service assignment-service notification-service api-gateway; do
            kustomize edit set image lms/$svc=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/$svc:${{ github.sha }}
          done
          kubectl apply -k .
          kubectl -n lms rollout status deployment/api-gateway --timeout=180s
