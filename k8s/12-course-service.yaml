apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: course-service-data
  namespace: lms
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: course-service
  namespace: lms
  labels:
    app: course-service
spec:
  replicas: 1
  strategy:
    type: Recreate   # single H2 file DB on a RWO volume: avoid two pods writing at once
  selector:
    matchLabels:
      app: course-service
  template:
    metadata:
      labels:
        app: course-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8083"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: course-service
          image: lms/course-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8083
          envFrom:
            - configMapRef:
                name: lms-config
            - secretRef:
                name: lms-jwt-secret
          resources:
            requests:
              cpu: "100m"
              memory: "384Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            initialDelaySeconds: 40
            periodSeconds: 20
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: course-service-data
---
apiVersion: v1
kind: Service
metadata:
  name: course-service
  namespace: lms
  labels:
    app: course-service
spec:
  selector:
    app: course-service
  ports:
    - port: 8083
      targetPort: 8083
      name: http
  type: ClusterIP
