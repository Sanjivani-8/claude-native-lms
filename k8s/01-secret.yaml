# DEV/DEMO ONLY. Do not commit real secrets to git.
# For real environments, generate with:
#   kubectl create secret generic lms-jwt-secret -n lms \
#     --from-literal=JWT_SECRET="$(openssl rand -base64 48)"
# or manage via a secret store (Vault, AWS Secrets Manager, Sealed Secrets, SOPS) and
# have your CD pipeline inject it — never keep production secrets in plain YAML in git.
apiVersion: v1
kind: Secret
metadata:
  name: lms-jwt-secret
  namespace: lms
type: Opaque
stringData:
  JWT_SECRET: "ChangeThisSecretKeyForLMSProjectJWTSigningMinimum256BitsLong!"
