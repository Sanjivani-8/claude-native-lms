# DevSecOps: default-deny + explicit allow, so backend services are only reachable
# from the gateway (and from Prometheus/kube-system for scraping/health probes),
# never directly from outside the cluster or from an unrelated pod.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: lms
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-to-backends
  namespace: lms
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [auth-service, student-service, course-service, assignment-service, notification-service]
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: api-gateway
        - namespaceSelector: {}   # allow kubelet/kube-system health probes; tighten per-cluster as needed
      ports:
        - port: 8081
        - port: 8082
        - port: 8083
        - port: 8084
        - port: 8085
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-gateway
  namespace: lms
spec:
  podSelector:
    matchLabels:
      app: api-gateway
  policyTypes: ["Ingress"]
  ingress:
    - from: []   # allowed from the Ingress controller / anywhere in-cluster; edit to scope to ingress-nginx namespace
      ports:
        - port: 8080
